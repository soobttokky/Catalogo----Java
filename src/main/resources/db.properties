# Configuração de conexão com o banco - ajuste usuário e senha
# allowPublicKeyRetrieval=true: necessário no MySQL 8 (usuário com caching_sha2_password) quando
# useSSL=false. Vale só para desenvolvimento local; em produção use SSL e remova essas duas opções.
db.url=jdbc:mysql://localhost:3306/catalogo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo&characterEncoding=UTF-8
db.user=root
db.password=root
